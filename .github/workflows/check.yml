name: Development checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: filum_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U filum_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_TEST_ADMIN_DSN: postgresql://filum_test:isolated-ci-only@127.0.0.1:5432/postgres
      REDIS_TEST_DSN: redis://127.0.0.1:6379/15
      FILUM_REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints-ci.txt
            requirements-paradigma.txt
      - run: python -m pip install -c backend/constraints-ci.txt -e './backend[dev]' -r requirements-paradigma.txt
      - run: python scripts/check_release.py --mode isolated-ci --suite backend --output verification-runs/backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ github.sha }}
          path: verification-runs/backend
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: python scripts/check_release.py --mode isolated-ci --suite frontend --output verification-runs/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/check_release.py --mode isolated-ci --suite smoke --output verification-runs/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-${{ github.sha }}
          path: |
            verification-runs/frontend
            verification-runs/smoke
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: error
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paradigma.txt
      - run: python -m pip install -r requirements-paradigma.txt
      - name: Verify repository governance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-runs/governance
          pd() { python scripts/pd.py "$@"; }
          pd catalog rebuild --dry-run --format json > verification-runs/governance/catalog-preview.json
          pd catalog rebuild --format json > verification-runs/governance/catalog-rebuild.json
          pd index rebuild --dry-run --format json > verification-runs/governance/index-preview.json
          pd index rebuild --format json > verification-runs/governance/index-rebuild.json
          git diff --exit-code -- memory-bank docs
          pd context verify --format json > verification-runs/governance/context.json
          pd agent-adapter check --format json > verification-runs/governance/adapter.json
          pd compliance check --profile strict --format json > verification-runs/governance/compliance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-${{ github.sha }}
          path: verification-runs/governance
          if-no-files-found: error
