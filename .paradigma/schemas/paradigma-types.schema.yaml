document_schema_version: "0.3"
description: Paradigma semantic type registry for OKF-compatible concept documents.

allowed_update_policies:
  - agent-editable
  - requires-human-confirmation
  - append-only
  - generated
  - read-only

allowed_epistemic_statuses:
  - confirmed
  - decision
  - proposal
  - assumption
  - deprecated
  - unknown

allowed_temperatures:
  - hot
  - warm
  - cold

allowed_lifecycles:
  - stable
  - evolving
  - append-only
  - ephemeral
  - generated
  - proposal

allowed_plan_statuses:
  - proposed
  - in-progress
  - completed
  - archived

required_frontmatter:
  - type
  - title
  - description
  - tags
  - timestamp

required_paradigma_fields:
  - schema_version
  - temperature
  - lifecycle
  - update_policy
  - epistemic_status

generated_blocks:
  required_markers:
    - "<!-- BEGIN PARADIGMA AUTO-INDEX -->"
    - "<!-- END PARADIGMA AUTO-INDEX -->"
  checksum_prefix: "<!-- checksum:"

types:
  paradigma-project-brief:
    layer: knowledge
    default_temperature: hot
    required_sections: []
  paradigma-architecture:
    layer: knowledge
    default_temperature: hot
    required_sections: []
  paradigma-convention:
    layer: knowledge
    default_temperature: hot
    required_sections: []
  paradigma-contract:
    layer: knowledge
    default_temperature: hot
    required_sections: []
  paradigma-domain:
    layer: knowledge
    default_temperature: warm
    required_sections: []
  paradigma-manual:
    layer: knowledge
    default_temperature: cold
    required_sections: []
  paradigma-decision:
    layer: knowledge
    default_temperature: cold
    required_sections: []
  paradigma-known-issue:
    layer: knowledge
    default_temperature: cold
    required_sections: []
  paradigma-glossary:
    layer: knowledge
    default_temperature: cold
    required_sections: []
  paradigma-rfc:
    layer: docs
    default_temperature: warm
    required_sections: []
  paradigma-design-system:
    layer: knowledge
    default_temperature: warm
    required_sections: []
  paradigma-plan:
    layer: knowledge
    default_temperature: warm
    # Filum 既有计划使用中文且结构多样；v0.7 的机器状态由 plan_status
    # 及其 temperature/epistemic tuple 强制，避免为了英文标题批量改写历史正文。
    required_sections: []
