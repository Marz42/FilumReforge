# Independent ephemeral test services. No application volumes or production credentials.
services:
  postgres:
    image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_USER: filum_test
      POSTGRES_PASSWORD: isolated-ci-only
      POSTGRES_DB: postgres
    ports: ['127.0.0.1:55432:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U filum_test -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports: ['127.0.0.1:56379:6379']
    command: [redis-server, '--save', '', '--appendonly', 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
